  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXUS — your personal decision intelligence. Model hard choices with options, weighted criteria, evidence and risk, then stress-test the outcome." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('nexus-store');
          var t = 'light';
          if (raw) {
            var s = JSON.parse(raw);
            if (s && s.state && s.state.theme) t = s.state.theme;
          } else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = t === 'dark' ? '#0C1210' : '#F1F2EE';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
